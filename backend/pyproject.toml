[project]
name = "seo-brain"
version = "0.2.0"
description = "SEO Brain platform backend: local-first SEO knowledge graph, analysis, AI orchestration and API (built on the v0.1 knowledge graph)"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "protego>=0.3",
  "networkx>=3.2",
  "pydantic>=2",
  "python-dotenv>=1",
  "pyyaml>=6",
  "mcp>=1.2",
  "google-api-python-client>=2",
  "google-auth-oauthlib>=1",
  "google-auth-httplib2>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3",
  "rapidfuzz>=3",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seo_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
