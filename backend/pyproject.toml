[project]
name = "seo-brain"
version = "0.2.0"
description = "SEO Brain platform backend: local-first SEO knowledge graph, analysis, AI orchestration and API (built on the v0.1 knowledge graph)"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "protego>=0.3",
  "networkx>=3.2",
  "pydantic==2.13.4",
  "python-dotenv>=1",
  "pyyaml>=6",
  "mcp==2.0.0",
  "google-api-python-client>=2",
  "google-auth-oauthlib>=1",
  "google-auth-httplib2>=0.2",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "jinja2>=3",
  "rapidfuzz>=3",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "maxminddb>=2.5",
  "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seo_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
