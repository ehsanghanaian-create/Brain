name: SEO Brain validation

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/seo-brain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run backend test suite
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install browser for UI checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser workflows and accessibility (synthetic data only)
        run: pnpm test:e2e
      - name: Upload UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
